<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>People · The Bob Dylan Fan Guide</title>
<meta name="description" content="The cast around Bob Dylan — family, bands, producers, collaborators, contemporaries and the biographers who have spent careers on him.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Oswald:wght@300;400;500&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="wrap">
  <header class="page-head">
    <p class="kicker">The Cast</p>
    <h1>People</h1>
    <p class="lede">Nobody does this alone, least of all someone who has hired a new band every few years for sixty-five years. The family, the players, the producers, the rivals and the chroniclers.</p>
  </header>
</div>

<main class="wrap">
  <div id="people-mount"></div>
</main>

<script src="assets/data/albums.js"></script>
<script src="assets/data/songs.js"></script>
<script src="assets/data/timeline.js"></script>
<script src="assets/data/quotes.js"></script>
<script src="assets/data/stories.js"></script>
<script src="assets/data/interviews.js"></script>
<script src="assets/data/people.js"></script>
<script src="assets/data/looks.js"></script>
<script src="assets/data/library.js"></script>
<script src="assets/data/honors.js"></script>
<script src="assets/data/tours.js"></script>
<script src="assets/data/covers.js"></script>
<script src="assets/data/resources.js"></script>
<script src="assets/data/eras.js"></script>
<script src="assets/js/site.js"></script>
<script>
DYLAN.chrome();
var esc = DYLAN.esc;

DYLAN.filterList({
  data: DYLAN.people,
  mount: '#people-mount',
  facetField: 'group',
  countNoun: 'people',
  searchFields: ['name', 'role', 'note', 'group'],
  render: function (rows) {
    return '<div class="grid grid-2">' + rows.map(function (p) {
      return '<div class="card"><h3>' + esc(p.name) + '</h3>' +
        '<div class="entry-meta" style="margin-bottom:8px"><span>' + esc(p.role) + '</span></div>' +
        '<p>' + esc(p.note) + '</p></div>';
    }).join('') + '</div>';
  }
});
</script>
</body>
</html>
