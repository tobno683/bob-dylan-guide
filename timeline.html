<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline · The Bob Dylan Fan Guide</title>
<meta name="description" content="A year-by-year chronology of Bob Dylan's life and career, from Duluth in 1941 to the tour still running in 2026.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,700;0,900;1,500;1,700&family=Oswald:wght@300;400;500&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="wrap">
  <header class="page-head">
    <p class="kicker">Chronology</p>
    <h1>Timeline</h1>
    <p class="lede">Eighty-five years, in order. Search for a year, a city or a name.</p>
  </header>
</div>

<main class="wrap">
  <div id="tl-mount"></div>
</main>

<script src="assets/data/albums.js"></script>
<script src="assets/data/songs.js"></script>
<script src="assets/data/timeline.js"></script>
<script src="assets/data/quotes.js"></script>
<script src="assets/data/stories.js"></script>
<script src="assets/data/interviews.js"></script>
<script src="assets/data/people.js"></script>
<script src="assets/data/looks.js"></script>
<script src="assets/data/library.js"></script>
<script src="assets/data/honors.js"></script>
<script src="assets/data/tours.js"></script>
<script src="assets/data/covers.js"></script>
<script src="assets/data/resources.js"></script>
<script src="assets/data/eras.js"></script>
<script src="assets/js/site.js"></script>
<script>
DYLAN.chrome();
var esc = DYLAN.esc;

DYLAN.filterList({
  data: DYLAN.timeline,
  mount: '#tl-mount',
  facetField: 'era',
  countNoun: 'events',
  searchFields: ['title', 'body', 'date', 'era', 'year'],
  render: function (rows) {
    var html = '<div class="timeline">';
    var lastEra = null;
    rows.forEach(function (t) {
      if (t.era !== lastEra) {
        html += '<h3 class="tl-era">' + esc(t.era) + '</h3>';
        lastEra = t.era;
      }
      html += '<div class="tl-item"><div class="tl-date">' + esc(t.date) + '</div>' +
        '<div class="tl-body"><strong>' + esc(t.title) + '</strong><p>' + esc(t.body) + '</p></div></div>';
    });
    return html + '</div>';
  }
});
</script>
</body>
</html>
