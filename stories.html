<script>
DYLAN.chrome();
var esc = DYLAN.esc;

DYLAN.filterList({
  data: DYLAN.stories,
  mount: '#stories-mount',
  facetField: 'tag',
  countNoun: 'stories',
  searchFields: ['title', 'body', 'when', 'tag'],
  render: function (rows) {
    return rows.map(function (s) {
      return '<article class="entry"><h3>' + esc(s.title) + '</h3>' +
        '<div class="entry-meta"><span>' + esc(s.when) + '</span></div>' +
        '<p>' + esc(s.body) + '</p></article>';
    }).join('');
  }
});
</script>
