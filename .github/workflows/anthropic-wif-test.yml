name: anthropic-wif-test
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

            // Claims are public metadata, not credentials — printing them shows
            // exactly what the federation rule has to be configured to accept.
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            core.info('OIDC claims presented to Anthropic:');
            for (const k of ['iss', 'aud', 'sub', 'repository', 'repository_owner',
                             'repository_owner_id', 'repository_id', 'ref', 'ref_type',
                             'event_name', 'workflow_ref', 'job_workflow_ref',
                             'environment', 'actor']) {
              if (claims[k] !== undefined) core.info(`  ${k} = ${claims[k]}`);
            }

      - name: Exchange for an Anthropic access token
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/req.json" <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01TU9vWvFJZDGCmmBCrTCMwF",
            "organization_id": "56b4c4e0-be93-4d89-85bd-3a131a140b13",
            "service_account_id": "svac_012y3SzddUTzuPTbfgJz1nJg",
            "workspace_id": "wrkspc_015XvKcwxHtnRXyrJDUZ8dQ1"
          }
          JSON

          code=$(curl -sS -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' \
            https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @"$RUNNER_TEMP/req.json")

          # redact anything whose key ends in "token" before it reaches the log
          jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)' \
            "$RUNNER_TEMP/resp.json"

          # curl's exit code is not enough here: the API returns its errors as a
          # 4xx with a JSON body, and piping into jq would mask the failure.
          if [ "$code" != "200" ]; then
            echo "::error::Token exchange failed with HTTP $code"
            exit 1
          fi
          echo "Token exchange succeeded (HTTP $code)"
