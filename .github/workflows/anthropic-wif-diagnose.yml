# Diagnostic only. The token endpoint returns an identical generic 401 for
# every authentication failure, so the only signal available is which
# variations change the response. This round isolates the workspace grant:
# if "default" succeeds where the explicit workspace fails, the service
# account simply lacks access to that workspace.
# Manual trigger only; delete once federation works.
name: anthropic-wif-diagnose
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      - name: Probe the exchange
        env:
          RULE: fdrl_01TU9vWvFJZDGCmmBCrTCMwF
          ORG: 56b4c4e0-be93-4d89-85bd-3a131a140b13
          SVC: svac_012y3SzddUTzuPTbfgJz1nJg
          WRK: wrkspc_015XvKcwxHtnRXyrJDUZ8dQ1
        run: |
          set -uo pipefail

          base () {
            jq -n --arg a "$JWT" --arg r "$RULE" --arg o "$ORG" --arg s "$SVC" --arg w "$WRK" \
              '{grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",
                assertion:$a, federation_rule_id:$r, organization_id:$o,
                service_account_id:$s, workspace_id:$w}'
          }

          probe () {
            local label="$1" body="$2"
            local out="$RUNNER_TEMP/out.json" code
            code=$(printf '%s' "$body" | curl -sS -o "$out" -w '%{http_code}' \
              https://api.anthropic.com/v1/oauth/token \
              -H "content-type: application/json" --data @-)
            printf '\n=== %s -> HTTP %s ===\n' "$label" "$code"
            jq -c 'if type=="object" then with_entries(if (.key|test("token$")) then .value="<redacted>" else . end) else . end' \
              "$out" 2>/dev/null || cat "$out"
            sleep 2
          }

          probe "control (explicit workspace)" "$(base)"
          probe "workspace_id = default"       "$(base | jq '.workspace_id = "default"')"
          probe "workspace_id omitted"         "$(base | jq 'del(.workspace_id)')"
          probe "service_account_id omitted"   "$(base | jq 'del(.service_account_id)')"
          probe "organization_id omitted"      "$(base | jq 'del(.organization_id)')"

          echo
          echo "If any variant returns HTTP 200 where the control returns 401,"
          echo "the field that changed is the one blocking the exchange."
